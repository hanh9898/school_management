apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-management
  labels:
    app: school-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: school-management
  template:
    metadata:
      labels:
        app: school-management
    spec:
      containers:
      - name: web
        image: school-management:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: ALLOWED_HOSTS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: school-management-secret
              key: SECRET_KEY
        - name: DB_ENGINE
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: DB_ENGINE
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: school-management-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: school-management-secret
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: DB_PORT
        - name: EMAIL_BACKEND
          valueFrom:
            configMapKeyRef:
              name: school-management-config
              key: EMAIL_BACKEND
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        command:
        - sh
        - -c
        - |
          python manage.py wait_for_db &&
          python manage.py migrate &&
          python manage.py collectstatic --noinput &&
          python manage.py runserver 0.0.0.0:8000
        volumeMounts:
        - name: static-volume
          mountPath: /app/staticfiles
        - name: media-volume
          mountPath: /app/media
      volumes:
      - name: static-volume
        persistentVolumeClaim:
          claimName: static-pvc
      - name: media-volume
        persistentVolumeClaim:
          claimName: media-pvc
