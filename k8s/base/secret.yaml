apiVersion: v1
kind: Secret
metadata:
  name: school-management-secret
  annotations:
    kubernetes.io/created-by: "env-vars"
    note: "Secret cơ bản được tạo từ biến môi trường. Sẽ được ghi đè bởi các secret cụ thể cho từng môi trường."
type: Opaque
# Trong file base, chúng ta chỉ định nghĩa cấu trúc của secret
# Các giá trị thực tế sẽ được cung cấp trong các file secret của từng môi trường
stringData:
  # Các giá trị này sẽ được ghi đè bởi các secret cụ thể cho từng môi trường
  SECRET_KEY: "${SECRET_KEY}"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
