apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: school-management-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - school.example.com
    - www.school.example.com
    secretName: school-tls
  rules:
  - host: school.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-management
            port:
              number: 80
  - host: www.school.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-management
            port:
              number: 80
