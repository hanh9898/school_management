apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-management
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: web
        resources:
          limits:
            cpu: "300m"
            memory: "384Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        command:
        - sh
        - -c
        - |
          python manage.py wait_for_db &&
          python manage.py migrate &&
          python manage.py collectstatic --noinput &&
          python manage.py runserver 0.0.0.0:8000
