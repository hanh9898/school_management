name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/init
  pull_request:
    branches:
      - main
      - feat/init

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python manage.py test
  
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    
    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    
    - name: Determine environment
      id: determine-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "::set-output name=env::prod"
        else
          echo "::set-output name=env::dev"
        fi
    
    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/school-management:${{ steps.determine-env.outputs.env }}
  
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
    
    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Determine environment
      id: determine-env
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "::set-output name=env::prod"
        else
          echo "::set-output name=env::dev"
        fi
    
    - name: Update kustomization.yaml
      run: |
        ENV=${{ steps.determine-env.outputs.env }}
        sed -i "s|newName: school-management|newName: ${{ secrets.DOCKER_HUB_USERNAME }}/school-management|g" k8s/overlays/$ENV/kustomization.yaml
    
    - name: Deploy to Kubernetes
      run: |
        ENV=${{ steps.determine-env.outputs.env }}
        NAMESPACE=school-management-$ENV
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -k k8s/overlays/$ENV -n $NAMESPACE
        kubectl rollout status deployment/$(kubectl get deployments -n $NAMESPACE -o jsonpath="{.items[0].metadata.name}") -n $NAMESPACE --timeout=300s
