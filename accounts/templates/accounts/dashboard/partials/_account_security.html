<div class="mb-3">
  <h6 class="mb-3">Thông tin tài khoản</h6>
  <p>
    <strong>Tên đăng nhập:</strong> {{ user.username }}
  </p>
  <p>
    <strong>Email:</strong> {{ user.email }}
  </p>
  <p>
    <strong>Lần đăng nhập cuối:</strong> {{ user.last_login|date:'d/m/Y H:i' }}
  </p>
</div>

<div class="mb-3">
  <h6 class="mb-3">Bảo mật</h6>
  <a href="{% url 'change_password' %}" class="btn btn-sm btn-outline-primary mb-2"><i class="fas fa-key me-1"></i> Đổi mật khẩu</a>
  <a href="{% url 'profile' %}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-user-edit me-1"></i> Cập nhật thông tin cá nhân</a>
</div>

<div class="alert alert-warning mt-3">
  <i class="fas fa-exclamation-triangle me-2"></i>
  Vui lòng đổi mật khẩu định kỳ để bảo vệ tài khoản của bạn.
</div>
